name: R golden check

# Checks the TypeScript compiler against the official R APIs:
#   1. builds every fixture IR with r/strategus-from-ir.R (Strategus / CohortMethod)
#   2. compares it with the TypeScript output (npm run golden:compare)
#   3. runs the R script that the UI offers for download
#   4. executes the GiBleed spec produced by TypeScript on Eunomia
# The weekly schedule catches upstream package changes.

on:
  push:
    branches: [main]
    paths: ["src/**", "r/**", "scripts/**", "tests/golden/**", ".github/workflows/r-golden.yml"]
  pull_request:
    paths: ["src/**", "r/**", "scripts/**", "tests/golden/**", ".github/workflows/r-golden.yml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure Java for R
        run: sudo R CMD javareconf

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('r/install.R') }}

      - name: Install R packages
        run: Rscript r/install.R

      - name: Export fixtures (IR, cohorts, TypeScript spec, R script)
        run: npm run fixtures:export

      - name: Build golden specs with R
        run: Rscript r/build-golden.R fixtures/out/*

      - name: Compare TypeScript output with R output
        run: npm run golden:compare

      - name: Check committed golden files are up to date
        run: |
          for d in fixtures/out/*/; do
            n=$(basename "$d")
            npx tsx -e "
              import { readFileSync } from 'node:fs';
              import { compareSpecs } from './src/compiler/equivalence';
              const a = JSON.parse(readFileSync('tests/golden/$n.spec.r.json', 'utf8'));
              const b = JSON.parse(readFileSync('fixtures/out/$n/spec.r.json', 'utf8'));
              const d = compareSpecs(a, b);
              if (d.length) { console.error('tests/golden/$n.spec.r.json is stale:', d.slice(0, 10)); process.exit(1); }
              console.log('tests/golden/$n.spec.r.json is up to date');
            "
          done

      - name: Run the downloadable R scripts
        run: |
          for d in fixtures/out/*/; do
            (cd "$d" && Rscript CreateAnalysisSpecification.R)
          done

      - name: Execute the TypeScript GiBleed spec on Eunomia
        run: Rscript r/run-eunomia.R fixtures/out/gibleed/spec.ts.json eunomia-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-fixtures
          path: |
            fixtures/out
            eunomia-run/results
